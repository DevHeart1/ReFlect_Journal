[tool.black]
line-length = 88
target-version = ['py312'] # Specify target Python version

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
# Add known Django and DRF imports to separate sections if desired
# known_django = ["django"]
# known_drf = ["rest_framework"]
# sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "DRF", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Show error codes in output
show_error_codes = true
# Exclude migrations and settings files from strict checks initially
exclude = ['/migrations/', '/settings/']
# Point to Django settings
# Note: Requires django-stubs and mypy installed with the plugin
# mypy_path = "src" # Point to the source directory
# plugins = ["mypy_django_plugin.main"]
# [tool.django-stubs]
# django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
# Look for tests in files matching test_*.py or *_test.py
python_files = ["tests.py", "test_*.py", "*_test.py"]
# Add source directory to python path
pythonpath = ["src"]
# Filter out Django warnings we might not care about during tests
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
